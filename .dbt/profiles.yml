my_dbt_project:
  outputs:
    dev:
      account: replace_this_account_identifier
      role: replace_this_snowflake_role
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      type: snowflake
      warehouse: replace_this_warehouse_name
      database: replace_this_database_name
      schema: replace_this_schema_name
      threads: 1
  target: dev
