my_dbt_project:
  outputs:
    dev:
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      role: "ACCOUNTADMIN"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      type: snowflake
      warehouse: "WORKSHOP_WH"
      database: "WORKSHOP_DB"
      schema: "RAW"
      threads: 1
  target: dev
